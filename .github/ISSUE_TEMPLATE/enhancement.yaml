name: Enhancement
description: Suggest an improvement to an existing feature or workflow
title: "[Enhancement]: "
labels:
  - enhancement
body:
  - type: textarea
    id: current-state
    attributes:
      label: Current state
      description: What currently exists or how does it currently work?
    validations:
      required: true

  - type: textarea
    id: proposed-improvement
    attributes:
      label: Proposed improvement
      description: What should be improved?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this improvement useful?
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add links, screenshots, examples, or other context.
    validations:
      required: false
